<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg-start: #f8f5ee;
        --bg-end: #e6ecf5;
        --card: #ffffff;
        --text: #223048;
        --muted: #5e6a7f;
        --primary: #1f5f9b;
        --primary-strong: #12416d;
        --accent: #de6b2f;
        --danger: #a83333;
        --danger-strong: #7d2424;
        --ring: rgba(31, 95, 155, 0.25);
      }

      body {
        font-family: "Segoe UI Variable", "Trebuchet MS", Verdana, sans-serif;
        width: 400px;
        margin: 0;
        padding: 14px;
        box-sizing: border-box;
        color: var(--text);
        background: radial-gradient(circle at 0% 0%, #fff7ea 0%, transparent 52%),
          radial-gradient(circle at 100% 0%, #e9f0fb 0%, transparent 50%),
          linear-gradient(145deg, var(--bg-start), var(--bg-end));
      }

      .popup-shell {
        position: relative;
        background: var(--card);
        border-radius: 14px;
        border: 1px solid rgba(34, 48, 72, 0.08);
        box-shadow: 0 12px 28px rgba(24, 34, 52, 0.15);
        padding: 14px;
        overflow: hidden;
      }

      .popup-shell::after {
        content: "";
        position: absolute;
        right: -38px;
        bottom: -48px;
        width: 138px;
        height: 138px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(222, 107, 47, 0.22) 0%, rgba(222, 107, 47, 0) 72%);
        pointer-events: none;
      }

      .header-row {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
        color: var(--primary-strong);
      }

      .icon-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .input-group {
        position: relative;
        z-index: 1;
        margin-bottom: 10px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.28px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .button {
        position: relative;
        z-index: 1;
        margin-top: 6px;
        width: 100%;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        padding: 10px 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      }

      .button:hover {
        filter: saturate(1.08);
        transform: translateY(-1px);
        box-shadow: 0 10px 14px rgba(28, 51, 82, 0.2);
      }

      .button:active {
        transform: translateY(0);
      }

      .delete-btn,
      .mode-btn,
      .circle-btn {
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .delete-btn:hover,
      .mode-btn:hover,
      .circle-btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      .delete-btn {
        background: linear-gradient(180deg, var(--danger), var(--danger-strong));
        color: white;
        min-width: 26px;
        height: 26px;
        font-size: 14px;
      }

      .mode-btn {
        width: 30px;
        height: 30px;
        background: #edf2f8;
        color: #2f3f59;
        font-size: 16px;
      }

      ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      .list-title {
        position: relative;
        z-index: 1;
        margin: 12px 0 8px;
        font-size: 13px;
        letter-spacing: 0.2px;
        color: #3b4b62;
      }

      li {
        margin: 7px 0;
        padding: 7px;
        border-radius: 10px;
        background: #f6f9fe;
        border: 1px solid rgba(52, 72, 105, 0.1);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .url-label {
        flex: 1;
        min-width: 0;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      input[type="text"] {
        width: 100%;
        padding: 8px 9px;
        box-sizing: border-box;
        border-radius: 9px;
        border: 1px solid #cad5e4;
        background: #fbfdff;
        color: var(--text);
      }

      input[type="color"] {
        width: 100%;
        height: 38px;
        padding: 4px;
        border-radius: 9px;
        border: 1px solid #cad5e4;
        background: #fbfdff;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="color"]:focus,
      .button:focus,
      .circle-btn:focus,
      .mode-btn:focus,
      .delete-btn:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }

      .circle-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
      }

      #helpButton {
        background: linear-gradient(180deg, #346cb4, #204580);
        font-weight: 700;
      }

      #openTableButton {
        background: linear-gradient(180deg, #de6b2f, #b84f1c);
        font-size: 15px;
      }

      #openTableButton:disabled {
        background: linear-gradient(180deg, #a9b1bf, #828d9e);
        cursor: not-allowed;
        filter: grayscale(0.18);
        transform: none;
      }

      #helpWindow {
        display: none;
        position: absolute;
        top: 46px;
        right: 14px;
        width: 260px;
        max-height: 220px;
        overflow: auto;
        padding: 10px;
        font-size: 12px;
        line-height: 1.45;
        background-color: white;
        border: 1px solid #d6dce7;
        border-radius: 10px;
        box-shadow: 0 12px 24px rgba(28, 45, 70, 0.2);
        z-index: 1000;
      }

      .import-export-section {
        position: relative;
        z-index: 1;
        margin-top: 14px;
      }

      #exportButton {
        margin-bottom: 10px;
      }

      .drop-zone {
        position: relative;
        border: 2px dashed #cad5e4;
        border-radius: 10px;
        padding: 18px 12px;
        text-align: center;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        background: #fbfdff;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .drop-zone:hover,
      .drop-zone.drag-over {
        border-color: var(--primary);
        background: #edf4fb;
      }

      @media (max-width: 430px) {
        body {
          width: auto;
          min-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="popup-shell">
      <div class="header-row">
        <h3>BC Menu-Bar Colorator</h3>
        <div class="icon-actions">
          <button class="circle-btn" id="openTableButton" title="Open table"></button>
          <button class="circle-btn" id="helpButton" title="Help">?</button>
        </div>
      </div>

      <div class="input-group">
        <label for="url">Base URL:</label>
        <input type="text" id="url" placeholder="Enter URL prefix" />
      </div>

      <div class="input-group">
        <label for="color">Color:</label>
        <input type="color" id="color" />
      </div>

      <button class="button" id="addUrlColor">Add URL</button>

      <h4 class="list-title">Saved URLs with Colors</h4>
      <ul id="urlList"></ul>

      <div class="import-export-section">
        <h4 class="list-title" id="importExportTitle">Import / Export</h4>
        <button class="button" id="exportButton">Export JSON</button>
        <div class="drop-zone" id="dropZone">
          <span id="dropZoneText">Drop JSON file here or click to import</span>
          <input type="file" id="fileInput" accept=".json" hidden />
        </div>
      </div>

      <div id="helpWindow">
        <p id="helpTextLbl"></p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
